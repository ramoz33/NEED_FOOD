<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Need Food - Criar Conta</title>
    <link rel="stylesheet" href="astyle.css">
</head>
<body class="auth-body">

    <div class="auth-card">
        <div class="auth-header">
            <h1 class="brand-title">NEED FOOD!</h1>
            <h2>Criar nova conta</h2>
        </div>

        <form action="serv.html" class="auth-form">
            <div class="input-group">
                <label for="name">Nome Completo</label>
                <input type="text" id="name" placeholder="Seu nome" required>
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="input-group">
                <label for="password">Palavra-passe</label>
                <input type="password" id="password" placeholder="Crie uma palavra-passe" required>
            </div>

            <button type="submit" class="auth-btn">CRIAR CONTA</button>
        </form>

        <div class="auth-footer">
            <p>Já tem uma conta? <a href="login.html">Entrar</a></p>
            <br>
            <a href="indexx.html">← Voltar ao início</a>
        </div>
    </div>

</body>
</html>
